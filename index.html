<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holomatrix</title>
  <meta name="description" content="Holomatrix">
  <meta property="og:title" content="Holomatrix">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#05070d">

  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="apple-touch-icon" href="/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/blocks.css">
  <link rel="stylesheet" href="/css/support.css">
</head>
<body>

  <!-- ===== NAV ===== -->
  <header class="nav" id="nav">
    <div class="wide nav-inner">
      <a href="/" class="brand" aria-label="Holomatrix home">
        <span class="img-slot logo-slot" data-img="brand.logo" data-alt="Holomatrix logo"><img src="/logo.jpg" alt="Holomatrix logo"></span>
        <span data-t="brand.name">Holomatrix</span>
      </a>
      <div class="nav-actions">
        <button class="btn btn-ghost btn-icon" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <a href="/login" id="nav-login" class="btn btn-ghost btn-sm" data-guest><span data-t="nav.login">Log in</span></a>
        <div class="account" id="account" data-user hidden>
          <button class="avatar-btn" id="account-btn" aria-label="Account"><span id="account-initial">?</span></button>
          <div class="account-menu" id="account-menu">
            <div class="account-name" id="account-name"></div>
            <a href="/dashboard">My dashboard</a>
            <a href="/admin" data-staff hidden>Admin dashboard</a>
            <button data-logout>Log out</button>
          </div>
        </div>
        <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <!-- ===== FULL-SCREEN MENU ===== -->
  <div class="menu" id="menu" aria-hidden="true">
    <div class="menu-inner">
      <nav class="menu-links" aria-label="Main">
        <div class="row" style="--i:0"><a href="#home" data-nav="hero"><i>01</i><span data-t="menu.home">Home</span></a></div>
        <div class="row" style="--i:1"><a href="#about" data-nav="about"><i>02</i><span data-t="menu.about">About</span></a></div>
        <div class="row" style="--i:2" data-guest><a href="/login"><i>03</i><span data-t="menu.login">Log in</span></a></div>
        <div class="row" style="--i:3" data-guest><a href="/signup"><i>04</i><span data-t="menu.signup">Sign up</span></a></div>
        <div class="row" style="--i:2" data-user hidden><a href="/dashboard"><i>03</i><span data-t="menu.dashboard">Dashboard</span></a></div>
        <div class="row" style="--i:3" data-user data-staff hidden><a href="/admin"><i>04</i><span data-t="menu.admin">Admin</span></a></div>
        <div class="row" style="--i:4" data-user hidden><button data-logout><i>05</i><span data-t="menu.logout">Log out</span></button></div>
      </nav>
      <div class="menu-side">
        <a href="https://www.instagram.com/holomatrix_consulting/" target="_blank" rel="noopener noreferrer" data-link="social.instagram" data-label="Instagram (menu + footer)"><span>Instagram</span></a>
        <a href="https://www.linkedin.com/company/holomatrixconsulting" target="_blank" rel="noopener noreferrer" data-link="social.linkedin" data-label="LinkedIn (menu + footer)"><span>LinkedIn</span></a>
      </div>
    </div>
  </div>

  <main>
    <!-- ===== HERO ===== -->
    <section class="hero" id="home" data-section="hero" data-label="Hero">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-shade"></div>
      <div class="wide hero-inner" id="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow" data-t="hero.eyebrow" data-ph="Small line above the title"></p>
          <h1 class="hero-title" data-t="hero.title">Holomatrix</h1>
          <p class="lead" data-t="hero.subtitle" data-multiline data-ph="Subtitle: add your details here"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="/signup" data-guest><span data-t="hero.cta1">Sign up</span></a>
            <a class="btn btn-ghost" href="/login" data-guest><span data-t="hero.cta2">Log in</span></a>
          </div>
        </div>
        <div class="holo" aria-hidden="true">
          <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
          <div class="holo-core img-slot" data-img="brand.logo"><img src="/logo.jpg" alt=""></div>
        </div>
      </div>
      <a class="scroll-cue" href="#about" data-nav="about"><span data-t="hero.scroll">Scroll</span><i></i></a>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="sheet" id="about" data-section="about" data-label="About">
      <div class="wide">
        <div class="reveal">
          <p class="kicker" data-t="about.kicker">About</p>
          <h2 class="scrub" data-t="about.statement" data-multiline data-ph="Write your big statement here"></h2>
        </div>

        <!-- Owner -->
        <div class="owner" id="owner">
          <div class="owner-media img-slot reveal-clip" data-img="owner.photo" data-alt="Amal Pushp">
            <span class="initials" data-t="owner.initials">AP</span>
          </div>
          <div class="reveal">
            <p class="kicker" data-t="owner.label">Owner</p>
            <h3 class="owner-name" data-t="owner.name">Amal Pushp</h3>
            <p class="owner-title" data-t="owner.title" data-ph="Title / role"></p>
            <p class="owner-bio" data-t="owner.bio" data-multiline data-ph="Short bio"></p>
            <div class="owner-links">
              <a class="pill" href="https://www.instagram.com/amalpjha2701/" target="_blank" rel="noopener noreferrer" data-link="owner.instagram" data-label="Owner: Instagram"><span data-t="owner.instagram.label">Instagram</span></a>
              <a class="pill" href="https://linktr.ee/amalpushp" target="_blank" rel="noopener noreferrer" data-link="owner.linktree" data-label="Owner: Linktree"><span data-t="owner.linktree.label">Linktree</span></a>
            </div>
          </div>
        </div>

        <!-- Team (from the staff_members table, hidden when empty) -->
        <div class="team" id="team" hidden>
          <div class="reveal">
            <p class="kicker" data-t="team.kicker">Team</p>
            <h3 data-t="team.title" data-ph="Team heading"></h3>
          </div>
          <div class="team-grid" id="team-grid"></div>
        </div>
      </div>
    </section>

    <!-- ===== CUSTOM BLOCKS (made in Admin → Website → Blocks) ===== -->
    <section class="blocks" id="blocks" data-section="blocks" data-label="Custom blocks">
      <div class="wide" id="blocks-list"></div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="wide">
      <div class="footer-word" data-t="brand.name">Holomatrix</div>
      <div class="footer-row">
        <small>© <span id="year"></span> <span data-t="brand.name">Holomatrix</span></small>
        <div class="footer-links">
          <a href="/privacy"><span data-t="footer.privacy">Privacy Policy</span></a>
          <a href="/terms"><span data-t="footer.terms">Terms of Service</span></a>
        </div>
        <div class="socials">
          <a href="https://www.instagram.com/holomatrix_consulting/" target="_blank" rel="noopener noreferrer" data-link="social.instagram"><span>Instagram</span></a>
          <a href="https://www.linkedin.com/company/holomatrixconsulting" target="_blank" rel="noopener noreferrer" data-link="social.linkedin"><span>LinkedIn</span></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/blocks.js"></script>
  <script src="/js/site.js"></script>
  <script src="/js/support.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
