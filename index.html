<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holomatrix | Strategy, Technology & Growth</title>
  <meta name="description" content="Holomatrix is a consulting team helping businesses and individuals turn ideas into measurable results.">
  <meta name="theme-color" content="#05070d">

  <!-- Social preview -->
  <meta property="og:title" content="Holomatrix">
  <meta property="og:description" content="Strategy, technology and growth, built for what’s next.">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link rel="apple-touch-icon" href="/logo.jpg">

  <!-- Fonts: https://fonts.google.com -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Apply saved theme BEFORE paint (prevents flash) -->
  <script>
    document.documentElement.classList.add('js');
    try { var t = localStorage.getItem('holo-theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/support.css">
</head>
<body>

  <!-- ===== NAV ===== -->
  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="/" class="brand" aria-label="Holomatrix home">
        <img src="/logo.jpg" alt="Holomatrix logo">
        <span>Holomatrix</span>
      </a>

      <nav class="nav-links" id="nav-links" aria-label="Main">
        <a href="#services">Services</a>
        <a href="#about">About</a>
        <a href="#faq">FAQ</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="nav-actions">
        <button class="btn btn-ghost btn-icon" data-theme-toggle aria-label="Toggle theme">🌙</button>
        <a href="/login" id="nav-login" class="btn btn-primary btn-sm">Log in</a>
        <button class="btn btn-icon nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== HERO ===== -->
    <section class="hero" id="home">
      <div class="hero-bg">
        <div class="hero-grid"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
      </div>

      <div class="container hero-inner">
        <div>
          <div class="eyebrow reveal" id="hero-eyebrow">Holomatrix</div>
          <h1 class="reveal" style="--d:100ms" id="hero-title">Holomatrix</h1>
          <p class="lead reveal" style="--d:200ms" id="hero-sub"></p>
          <div class="hero-cta reveal" style="--d:300ms">
            <a class="btn btn-primary" id="hero-cta1" href="/login">Get started</a>
            <a class="btn btn-ghost" id="hero-cta2" href="#services">Explore services</a>
          </div>
        </div>

        <div class="holo reveal" style="--d:250ms" aria-hidden="true">
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="holo-core"><img src="/logo.jpg" alt=""></div>
        </div>
      </div>
    </section>

    <!-- ===== STATS ===== -->
    <section class="stats">
      <div class="container"><div class="stats-grid" id="stats-grid"></div></div>
    </section>

    <!-- ===== SERVICES ===== -->
    <section class="section" id="services">
      <div class="container">
        <div class="section-head center reveal">
          <div class="kicker" id="services-kicker"></div>
          <h2 id="services-title"></h2>
          <p id="services-sub"></p>
        </div>
        <div class="grid-3" id="services-grid"></div>
      </div>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="section" id="about">
      <div class="container about-grid">
        <div class="reveal">
          <div class="kicker" id="about-kicker"></div>
          <h2 id="about-title"></h2>
          <p id="about-text"></p>
        </div>
        <div class="points" id="about-points"></div>
      </div>
    </section>

    <!-- ===== FAQ ===== -->
    <section class="section" id="faq">
      <div class="container">
        <div class="section-head center reveal">
          <div class="kicker">FAQ</div>
          <h2>Questions, answered</h2>
        </div>
        <div class="faq-list" id="faq-list"></div>
      </div>
    </section>

    <!-- ===== CONTACT / CTA ===== -->
    <section class="section" id="contact">
      <div class="container">
        <div class="cta-card reveal">
          <h2 id="contact-title"></h2>
          <p id="contact-text"></p>
          <div class="cta-actions">
            <a class="btn btn-primary" href="/login">Create free account</a>
            <button class="btn btn-ghost" id="cta-chat" type="button">💬 Chat with us</button>
          </div>
          <div class="contact-lines" id="contact-lines"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a href="/" class="brand"><img src="/logo.jpg" alt=""><span>Holomatrix</span></a>
        <small>© <span id="year"></span> Holomatrix. All rights reserved.</small>
      </div>
      <div class="footer-links">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </div>
      <div class="socials">
        <a id="ig-link" href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a id="li-link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
  </footer>

  <!-- Scripts: Supabase library → config → client → UI → page logic -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/support.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
